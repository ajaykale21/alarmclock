<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-gamepad"></i> Advanced Tic Tac Toe</h1>
            <div class="theme-toggle">
                <button id="theme-btn" class="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <div class="game-setup">
            <div class="setup-section">
                <h3>Game Mode</h3>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="pvp">
                        <i class="fas fa-users"></i> Player vs Player
                    </button>
                    <button class="mode-btn" data-mode="pvc">
                        <i class="fas fa-robot"></i> Player vs Computer
                    </button>
                </div>
            </div>

            <div class="setup-section">
                <h3>Board Size</h3>
                <div class="size-buttons">
                    <button class="size-btn active" data-size="3">3x3</button>
                    <button class="size-btn" data-size="4">4x4</button>
                    <button class="size-btn" data-size="5">5x5</button>
                </div>
            </div>

            <div class="setup-section ai-difficulty" style="display: none;">
                <h3>AI Difficulty</h3>
                <div class="difficulty-buttons">
                    <button class="diff-btn" data-difficulty="easy">Easy</button>
                    <button class="diff-btn active" data-difficulty="medium">Medium</button>
                    <button class="diff-btn" data-difficulty="hard">Hard</button>
                    <button class="diff-btn" data-difficulty="impossible">Impossible</button>
                </div>
            </div>

            <div class="setup-section">
                <h3>Players</h3>
                <div class="player-setup">
                    <div class="player-input">
                        <label>Player 1 (X):</label>
                        <input type="text" id="player1-name" placeholder="Enter name" maxlength="15">
                        <div class="symbol-picker">
                            <button class="symbol-btn active" data-player="1" data-symbol="X">X</button>
                            <button class="symbol-btn" data-player="1" data-symbol="O">O</button>
                            <button class="symbol-btn" data-player="1" data-symbol="★">★</button>
                            <button class="symbol-btn" data-player="1" data-symbol="♦">♦</button>
                        </div>
                    </div>
                    <div class="player-input">
                        <label>Player 2 (O):</label>
                        <input type="text" id="player2-name" placeholder="Enter name" maxlength="15">
                        <div class="symbol-picker">
                            <button class="symbol-btn" data-player="2" data-symbol="X">X</button>
                            <button class="symbol-btn active" data-player="2" data-symbol="O">O</button>
                            <button class="symbol-btn" data-player="2" data-symbol="★">★</button>
                            <button class="symbol-btn" data-player="2" data-symbol="♦">♦</button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="start-game-btn">
                <i class="fas fa-play"></i> Start Game
            </button>
        </div>

        <div class="game-area" style="display: none;">
            <div class="game-info">
                <div class="scoreboard">
                    <div class="score player1-score">
                        <span class="player-name">Player 1</span>
                        <span class="score-value">0</span>
                    </div>
                    <div class="score ties-score">
                        <span class="player-name">Ties</span>
                        <span class="score-value">0</span>
                    </div>
                    <div class="score player2-score">
                        <span class="player-name">Player 2</span>
                        <span class="score-value">0</span>
                    </div>
                </div>
                
                <div class="current-player">
                    <span id="current-player-text">Player 1's turn</span>
                    <div class="timer" id="timer">30</div>
                </div>
                
                <div class="game-controls">
                    <button class="control-btn" id="hint-btn">
                        <i class="fas fa-lightbulb"></i> Hint
                    </button>
                    <button class="control-btn" id="undo-btn">
                        <i class="fas fa-undo"></i> Undo
                    </button>
                    <button class="control-btn" id="pause-btn">
                        <i class="fas fa-pause"></i> Pause
                    </button>
                </div>
            </div>

            <div class="game-board-container">
                <div class="game-board" id="game-board">
                    <!-- Board cells will be generated dynamically -->
                </div>
                
                <div class="winning-line" id="winning-line"></div>
            </div>

            <div class="game-actions">
                <button class="action-btn secondary" id="new-game-btn">
                    <i class="fas fa-refresh"></i> New Game
                </button>
                <button class="action-btn secondary" id="back-to-setup-btn">
                    <i class="fas fa-cog"></i> Settings
                </button>
            </div>
        </div>

        <div class="modal" id="game-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Game Over!</h2>
                    <button class="close-modal" id="close-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="result-icon" id="result-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <p id="modal-message">Congratulations!</p>
                    <div class="modal-stats">
                        <div class="stat">
                            <span class="stat-label">Game Duration:</span>
                            <span class="stat-value" id="game-duration">0:00</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Moves Made:</span>
                            <span class="stat-value" id="moves-count">0</span>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="action-btn primary" id="play-again-btn">
                        <i class="fas fa-play"></i> Play Again
                    </button>
                    <button class="action-btn secondary" id="change-settings-btn">
                        <i class="fas fa-cog"></i> Change Settings
                    </button>
                </div>
            </div>
        </div>

        <div class="pause-overlay" id="pause-overlay" style="display: none;">
            <div class="pause-content">
                <h2><i class="fas fa-pause"></i> Game Paused</h2>
                <button class="action-btn primary" id="resume-btn">
                    <i class="fas fa-play"></i> Resume
                </button>
                <button class="action-btn secondary" id="quit-btn">
                    <i class="fas fa-home"></i> Quit to Menu
                </button>
            </div>
        </div>
    </div>

    <div class="particles" id="particles"></div>
    
    <script src="script.js"></script>
</body>
</html>
